name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild diario 12:00 UTC (06:00 CDMX): publica los posts cuya fecha ya llegó
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 11: misma versión que en local; pnpm 9 rechaza el
          # pnpm-workspace.yaml de solo-configuración (allowBuilds)
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requiere Node >= 22.13
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 749fddd2fc3c14d436d163395cfaa923
          command: pages deploy dist --project-name=muusicacom-home --branch=production
